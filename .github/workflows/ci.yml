name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            artifact: mac
          - os: windows-latest
            script: package:win
            artifact: windows
          - os: ubuntu-latest
            script: package:linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate version consistency
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: ${PKG_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            # Strip optional leading 'v' from tag (v1.0.0 -> 1.0.0)
            TAG_VERSION_NO_V="${TAG_VERSION#v}"
            echo "git tag: ${TAG_VERSION} (normalized: ${TAG_VERSION_NO_V})"
            if [[ "${PKG_VERSION}" != "${TAG_VERSION_NO_V}" ]]; then
              echo "::error::Version mismatch: package.json=${PKG_VERSION}, tag=${TAG_VERSION_NO_V}"
              exit 1
            fi
            echo "Version consistency: OK (${PKG_VERSION})"
          else
            echo "Not a tag push — skipping tag/version equality check"
          fi
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: skill-switch-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve versioned release notes
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_NOTES_PATH="docs/release-notes/v${PKG_VERSION}.md"
          if [[ ! -f "${RELEASE_NOTES_PATH}" ]]; then
            echo "::error::Missing release notes: ${RELEASE_NOTES_PATH}"
            exit 1
          fi
          echo "RELEASE_NOTES_PATH=${RELEASE_NOTES_PATH}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Collect and validate required assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Collect installable artifacts (exclude unpacked dirs, blockmaps, yml metadata)
          find dist -type f \( \
            -name '*.dmg' -o \
            -name '*Setup*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) ! -path 'dist/*-unpacked/*' -exec cp {} release-assets/ \;
          echo "=== Collected assets ==="
          ls -lh release-assets/

          PKG_VERSION=$(node -p "require('./package.json').version")
          missing=0
          if find release-assets -type f -size 0 | grep -q .; then
            echo "::error::Required release assets must be non-empty"
            missing=1
          fi
          for asset in release-assets/*; do
            if [[ "$(basename "${asset}")" != *"${PKG_VERSION}"* ]]; then
              echo "::error::Asset version mismatch: $(basename "${asset}") does not contain ${PKG_VERSION}"
              missing=1
            fi
          done
          if ! ls release-assets/*-"${PKG_VERSION}"-arm64.dmg >/dev/null 2>&1; then
            echo "::error::Missing required macOS DMG"
            missing=1
          fi
          if ! ls release-assets/*-Setup-"${PKG_VERSION}"-x64.exe >/dev/null 2>&1; then
            echo "::error::Missing required Windows x64 NSIS installer"
            missing=1
          fi
          if ! ls release-assets/*-"${PKG_VERSION}"-x64.AppImage >/dev/null 2>&1 \
            && ! ls release-assets/*-"${PKG_VERSION}"-x64.deb >/dev/null 2>&1; then
            echo "::error::Missing required Linux x64 installer (AppImage or DEB)"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::Required asset contract not satisfied"
            exit 1
          fi
          echo "=== Required asset contract: OK ==="

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          prerelease: false
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: false
